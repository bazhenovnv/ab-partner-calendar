name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "=== ACQUIRE DEPLOY LOCK ==="
            exec 9>/tmp/ab-partner-calendar-deploy.lock
            flock -w 900 9

            echo "=== GO TO PROJECT ==="
            cd ~/deploy/app

            echo "=== FORCE SYNC CODE ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== STOP OLD CONTAINERS ==="
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "=== REMOVE STALE CONTAINERS ==="
            docker rm -f app-nginx-1 app-frontend-1 app-backend-1 app-postgres-1 2>/dev/null || true

            echo "=== BUILD & START PROD ==="
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "=== CLEAN OLD IMAGES ==="
            docker image prune -f

            echo "=== STATUS ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== DONE ==="
